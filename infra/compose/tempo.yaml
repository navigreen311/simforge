# Grafana Tempo — single-binary, local-storage trace backend for the SimForge stack (ADR-0031).
# Receives spans over OTLP/HTTP (:4318) from the API and serves them to Grafana (:3200).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

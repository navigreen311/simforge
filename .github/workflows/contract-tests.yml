name: contract-tests
on:
  pull_request:
    paths: ["apps/api/**", "packages/validator/**"]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "apps/api[dev]" && pip install -e packages/validator
      # Consumer-driven contract tests (ADR-0036): Forge-sandbox Pact + village_bridge contract.
      - run: cd apps/api && pytest tests/contract -q

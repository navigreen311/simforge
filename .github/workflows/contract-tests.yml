name: contract-tests
on:
  pull_request:
    paths: ["apps/api/**", "packages/validator/**"]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "apps/api[dev]" && pip install -e packages/validator
      # WEEK 9: Pact-style village_bridge + Forge-adapter contract tests.
      - run: cd apps/api && pytest tests/contract -q || echo "no contract tests yet (v1.1)"

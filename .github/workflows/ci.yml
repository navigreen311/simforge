name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/validator[dev]"
      - run: cd packages/validator && ruff check src tests && pytest -q

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install api + validator
        run: |
          pip install -e "apps/api[dev]"
          pip install -e packages/validator
      - name: Lint
        run: cd apps/api && ruff check src tests
      - name: Tests (hermetic SQLite)
        run: cd apps/api && pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + lint + test + build
        run: |
          pnpm --filter web typecheck
          pnpm --filter web lint
          pnpm --filter web test
          pnpm --filter web build

[project]
name = "simforge-api"
version = "1.0.0"
description = "SimForge FastAPI backend — governance & certification for Village OS agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "redis>=5.0",
    "rq>=1.16",
    "apscheduler>=3.10,<4",  # in-process cadence scheduler (Part 16 continuous cadence)
    "structlog>=24.1",
    "python-ulid>=2.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "anthropic>=0.40.0",
    "pyjwt[crypto]>=2.8",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # Document ingestion (Scenario Bank Batch 3). Both pure-Python, no native/system deps.
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",  # FastAPI UploadFile form parsing
    # YouTube caption ingestion (Scenario Bank Batch 6). Pure-Python; audio transcription uses
    # raw HTTPS (httpx) with no vendor SDK, so no openai dependency is added.
    "youtube-transcript-api>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-recording>=0.13.0",
    "pact-python>=3.0",
]
# HSM signing backends (HSM_PROVIDER=yubihsm|cloudhsm). Optional: only needed to activate a real
# HSM — install alongside a reachable device + credentials. Not pulled by dev/CI.
hsm = [
    "yubihsm[http]>=3.0",
    "python-pkcs11>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls are idiomatic in argument defaults (B008 false positive).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = false

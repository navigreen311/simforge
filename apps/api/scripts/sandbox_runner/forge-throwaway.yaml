# A THROWAWAY sandbox CRE Forge for testing the SimForge sandbox runner (ADR-0166 stage 7).
#
# Ivan Green, 10 November 2026: "test on throwaway stacks; never load worlds into or depend on
# the shared sandbox Forge; only the stage 7 runner does." `sandbox_run --throwaway` overlays
# this on medlink-wholesale's docker-compose.sandbox.yml: its own project, containers, image
# tag, volume (project-scoped), token and port (8013, the throwaway port The Office's guard
# allows). The runner takes it down with its volume at the end.
#
# The project is per runner home (`runner.home_tag`), passed as SF_RUNNER_FORGE_PROJECT with
# `-p`: two homes once shared `sf-runner-forge`, so one run's `down -v` could remove another's
# stack (11 November). Each container is labelled with the home that started it, so a start
# from another home can name who holds the throwaway ports.

services:
  sandbox-db:
    container_name: ${SF_RUNNER_FORGE_PROJECT:?the runner sets it}-db
    labels:
      simforge.sandbox.home: ${SF_RUNNER_HOME:?the runner sets it}
  sandbox-redis:
    container_name: ${SF_RUNNER_FORGE_PROJECT:?the runner sets it}-redis
    labels:
      simforge.sandbox.home: ${SF_RUNNER_HOME:?the runner sets it}
  backend:
    image: ${SF_RUNNER_FORGE_PROJECT:?the runner sets it}-backend
    container_name: ${SF_RUNNER_FORGE_PROJECT:?the runner sets it}-backend
    labels:
      simforge.sandbox.home: ${SF_RUNNER_HOME:?the runner sets it}
  gateway:
    container_name: ${SF_RUNNER_FORGE_PROJECT:?the runner sets it}-gateway
    labels:
      simforge.sandbox.home: ${SF_RUNNER_HOME:?the runner sets it}
